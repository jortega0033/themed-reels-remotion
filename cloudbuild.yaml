steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'remotion-renderer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '4Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '600'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'

options:
  logging: CLOUD_LOGGING_ONLY

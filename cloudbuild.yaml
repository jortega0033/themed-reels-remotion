steps:
  # Cancel any previous in-progress builds for this trigger
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        gcloud builds list --ongoing --filter="substitutions.TRIGGER_NAME=$TRIGGER_NAME" --format="value(id)" | \
        grep -v $BUILD_ID | \
        xargs -r -I {} gcloud builds cancel {} --quiet || true

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'remotion-renderer'
      - '--image'
      - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--memory'
      - '16Gi'
      - '--cpu'
      - '8'
      - '--concurrency'
      - '1'
      - '--max-instances'
      - '1'
      - '--timeout'
      - '3600'
      - '--cpu-boost'
      - '--no-cpu-throttling'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/remotion-renderer:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/remotion-renderer:latest'

options:
  logging: CLOUD_LOGGING_ONLY
